name: Build APK

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache translation model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: build/model
          key: model-opus-fr-en-${{ hashFiles('tools/export_model.py') }}

      - name: Export FR→EN model (ONNX int8)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers<5" sentencepiece sacremoses onnx onnxruntime "optimum[onnxruntime]" accelerate
          python tools/export_model.py Helsinki-NLP/opus-mt-fr-en build/model

      - name: Install model into app assets
        run: tools/install_model.sh build/model

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test

      - name: Build release APK (with native engines)
        run: ./gradlew :app:assembleRelease -Pcarnet.native=true

      - uses: actions/upload-artifact@v4
        with:
          name: Carnet-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
