name: Build APK

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bundle the model catalog (models are downloaded in the app)
        run: |
          mkdir -p app/src/main/assets
          curl -sfL https://github.com/${{ github.repository }}/releases/download/models-v2/models.json -o app/src/main/assets/models.json || echo "no catalog yet"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core) and app smoke test
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Build release APK (with native engines)
        run: ./gradlew :app:assembleRelease -Pcarnet.native=true -Pcarnet.build=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: Carnet-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Every build on the app branch becomes the latest release; installed apps see update.json and offer it.
      - name: Publish update
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="1.2.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk Carnet.apk
          size=$(stat -c %s Carnet.apk); sha=$(sha256sum Carnet.apk | cut -d' ' -f1)
          notes=$(git log -1 --pretty=%s | head -c 300)
          python3 - "$v" "$size" "$sha" "$notes" <<'PY'
          import json, sys
          v, size, sha, notes = sys.argv[1:5]
          json.dump({"versionCode": 100 + int(v.split(".")[-1]), "versionName": v,
                     "apk": f"https://github.com/${{ github.repository }}/releases/download/v{v}/Carnet.apk",
                     "size": int(size), "sha256": sha, "notes": notes}, open("update.json", "w"))
          PY
          gh release create "v$v" Carnet.apk update.json --title "Carnet $v" --notes "$notes" --target ${{ github.sha }} --latest
