name: Speed benchmark

# Measures speed and quality of the app's Kotlin pipeline (same ONNX Runtime kernels as Android) on
# x86-64 and ARM64 CPUs, for each published model (release models-v1). Results go to the job summary.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Publish models" ]
    types: [ completed ]
  push:
    paths: [ "core/src/main/**", ".github/workflows/speed.yml" ]

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Download models
        run: |
          base=https://github.com/${{ github.repository }}/releases/download/models-v1
          curl -sfL $base/models.json -o models.json
          python3 - <<'PY'
          import json, os, urllib.request
          for m in json.load(open("models.json"))["models"]:
              os.makedirs("models/" + m["id"], exist_ok=True)
              for f in m["files"]:
                  urllib.request.urlretrieve(f["url"], f"models/{m['id']}/{f['name']}")
          PY
      - name: Benchmark
        run: |
          pip install sacrebleu > /dev/null 2>&1 || pip install --break-system-packages sacrebleu > /dev/null
          echo "### $(uname -m), $(nproc) cores: $(lscpu | grep 'Model name' | cut -d: -f2 | xargs)" >> $GITHUB_STEP_SUMMARY
          echo "| model | size | set | sentences/s | BLEU | chrF |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for m in $(ls models); do
            size=$(du -cm models/$m/*.onnx | tail -1 | cut -f1)
            case $m in fr-en*) sets="flores300:fr:en news500:fr:en";; *) sets="flores300:en:fr";; esac
            for s in $sets; do
              IFS=: read set sl tl <<< "$s"
              out=$(./gradlew -q :core:bench -PbenchArgs="mt $PWD/models/$m $PWD/tools/eval/data/$set.$sl $PWD/$m.$set.out" 2>&1 | grep translated)
              rate=$(echo "$out" | sed -E 's/.* ([0-9.]+) lines\/s.*/\1/')
              score=$(sacrebleu tools/eval/data/$set.$tl -i $m.$set.out -m bleu chrf -b | tr '\n' ' ')
              echo "| $m | ${size} MB | $set | $rate | $score |" >> $GITHUB_STEP_SUMMARY
              echo "$m $set $out $score"
            done
          done
