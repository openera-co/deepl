name: Publish handwriting model

# The handwriting reader fine-tuned on RIMES + synthetic school lines (tools/kaggle/htr_finetune):
# 4-bit, same tokenizer as before. With the app's own code on 200 RIMES test lines: 4.74% CER / 16.2% WER
# vs 5.11% / 18.6% for the previous model. Files come from the temporary branch artifacts-htr-school
# (split under GitHub's file limit), are checked, uploaded to models-v2 and put in its catalog.
on:
  workflow_dispatch:
  push:
    paths: [ ".github/workflows/htr2.yml" ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: artifacts-htr-school, path: art }
      - name: Reassemble and check
        run: |
          mkdir -p up
          cat art/decoder.part* > up/htr-fr__decoder_model_merged.int8.onnx
          cp art/encoder.part00 up/htr-fr__encoder_model.int8.onnx
          (cd up && sed 's/  /  htr-fr__/' ../art/sha.txt | sha256sum -c -)
      - name: Catalog
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download models-v2 -p models.json -R ${{ github.repository }}
          python3 - <<'PY'
          import json, hashlib, os
          cat = json.load(open("models.json"))
          for m in cat["models"]:
              if m["id"] != "htr-fr": continue
              for f in m["files"]:
                  p = "up/htr-fr__" + f["name"]
                  if os.path.exists(p):
                      f["size"] = os.path.getsize(p); f["sha256"] = hashlib.sha256(open(p, "rb").read()).hexdigest()
          json.dump(cat, open("up/models.json", "w"), indent=1, ensure_ascii=False)
          print(json.dumps([m for m in cat["models"] if m["id"] == "htr-fr"], indent=1))
          PY
      - name: Upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release upload models-v2 up/* --clobber -R ${{ github.repository }}
          gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/artifacts-htr-school || true
