name: OCR benchmark

# Runs the app's real text recognizer (ML Kit, same code as the Scan screen) on an Android emulator
# over generated photos with known text (printed in many styles + handwriting-style), for several
# preprocessing variants, and reports character/word error rates per category.
on:
  workflow_dispatch:
  push:
    paths: [ "app/src/main/kotlin/app/carnet/ocr/**", "app/src/androidTest/**", "tools/ocr/**", ".github/workflows/ocr.yml" ]

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Test images
        run: |
          sudo apt-get install -y -q fonts-dejavu fonts-liberation fonts-crosextra-carlito fonts-freefont-ttf > /dev/null
          pip install -q pillow python-docx python-pptx openpyxl odfpy reportlab
          python tools/ocr/make_set.py ocrset 140 60 hand-fonts
      - uses: gradle/actions/setup-gradle@v4
      - name: Build for the emulator
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pcarnet.abi=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run OCR on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell mkdir -p /data/local/tmp/ocrbench
            adb push ocrset/. /data/local/tmp/ocrbench/ > /dev/null
            adb shell chmod -R a+r /data/local/tmp/ocrbench
            adb shell "run-as app.carnet sh -c 'mkdir -p files/ocrbench/in && cp /data/local/tmp/ocrbench/* files/ocrbench/in/'"
            adb shell "run-as app.carnet ls files/ocrbench/in | wc -l"
            for v in default auto contrast all; do adb shell am instrument -w -e class app.carnet.OcrBench -e variant $v app.carnet.test/androidx.test.runner.AndroidJUnitRunner | tail -3; adb exec-out run-as app.carnet cat files/ocrbench/out-$v.json > out-$v.json; done
      - name: Score
        if: always()
        run: python tools/ocr/score.py ocrset out-*.json | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ocr-results, path: "out-*.json" }
