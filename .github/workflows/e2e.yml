name: End-to-end

# The app on an emulator, used like a student: one-button model download, then every file in
# testdata/e2e translated through the real job (Document/Scan screens). Timings, outputs and
# side-by-side page renders (original | translated | app preview) are published to the
# prerelease "v0-e2e".
on:
  workflow_dispatch:
    inputs:
      quality: { description: "best or fast", default: "best" }
  push:
    branches: [ "claude/**" ]
    paths: [ "app/src/**", "core/src/**", "pdfshared/**", "testdata/e2e/**", "tools/e2e/**", ".github/workflows/e2e.yml" ]

permissions:
  contents: write

concurrency: { group: e2e, cancel-in-progress: false }

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Bundle the model catalog
        run: |
          mkdir -p app/src/main/assets
          curl -sfL https://github.com/${{ github.repository }}/releases/download/models-v1/models.json -o app/src/main/assets/models.json || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build for the emulator
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pcarnet.abi=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 8000M
          disable-animations: true
          script: bash tools/e2e/run.sh ${{ github.event.inputs.quality || 'best' }}
      - name: Render
        if: always()
        run: |
          sudo apt-get install -y -q libreoffice-writer libreoffice-calc libreoffice-impress fonts-dejavu fonts-liberation fonts-crosextra-carlito > /dev/null
          pip install -q pymupdf pillow
          mkdir -p e2e-out && python tools/e2e/render.py testdata/e2e e2e-out e2e-render | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-results, path: "e2e-render/**" }
      - name: Publish
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd e2e-render 2>/dev/null || exit 0
          cp ../e2e-out/report.json . 2>/dev/null || true
          (cd ../e2e-out && zip -q -r ../e2e-render/outputs.zip . ) || true
          cp ../e2e-logcat.txt . 2>/dev/null || true
          gh release delete v0-e2e -y --cleanup-tag 2>/dev/null || true
          gh release create v0-e2e * --prerelease --latest=false --title "End-to-end test results" --notes "Commit ${{ github.sha }}. Not an app release." --target ${{ github.sha }}
